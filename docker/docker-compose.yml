services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-culling-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DB_PATH=/app/data/ai_culling.db
    volumes:
      - ../uploads:/app/uploads
      - ../data:/app/data
