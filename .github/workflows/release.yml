name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: pull requests that touch packaging build every installer without publishing.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "frontend/electron/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "requirements*.txt"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            backend: ai-culling-backend
            artifacts: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
          - name: windows
            os: windows-latest
            backend: ai-culling-backend.exe
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: brew install libraw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME#v}
          cd frontend && npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Validate backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Validate frontend
        run: |
          cd frontend
          npm ci
          npm test

      - name: Build DMG and update zip
        if: runner.os == 'macOS'
        run: make package

      - name: Build installer
        if: runner.os == 'Windows'
        run: |
          python -m venv .package-venv
          .package-venv/Scripts/python.exe -m pip install --upgrade pip
          .package-venv/Scripts/python.exe -m pip install -r requirements-package.txt
          cd frontend
          PYTHON="$GITHUB_WORKSPACE/.package-venv/Scripts/python.exe" npm run package:win

      - name: Smoke test the bundled backend
        run: |
          export FLASK_PORT=5099 DB_PATH="$RUNNER_TEMP/smoke.db" UPLOAD_FOLDER="$RUNNER_TEMP/uploads"
          "./build/backend/${{ matrix.backend }}" > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$FLASK_PORT/api/workspaces" > /dev/null; then
              echo "backend answered after ${i}s"
              kill "$pid" 2>/dev/null || taskkill //F //IM "${{ matrix.backend }}" > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
