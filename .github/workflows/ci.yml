name: CI

on:
  push:
    branches: [main]
  # Include stacked feature PRs, not only changes targeting main.
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm test

      - name: Build frontend
        run: cd frontend && npm run build

      # Electron's WebGL runs on ANGLE: Direct3D 11 on Windows, Metal on macOS. Compile and draw the
      # live preview there, so a shader that only one backend struggles with is caught here.
      - name: Check the live preview in Chrome (ANGLE)
        if: runner.os != 'Linux'
        run: |
          cd frontend
          npm install --no-save puppeteer-core@23.11.1
          node scripts/check-webgl-preview.cjs
